<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Note — คำนวณเกรดเฉลี่ยแบบเรียบๆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">

    <!-- หัวเรื่อง + มาสคอต -->
    <header class="hero">
      <div class="mascot" id="mascot" aria-hidden="true">
        <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
          <!-- glow -->
          <ellipse cx="110" cy="235" rx="70" ry="14" fill="var(--cyan)" opacity="0.15"/>

          <!-- twin tails (back layer) -->
          <path class="tail tail-left" d="M78,90 C40,95 20,150 34,220 C40,190 55,150 82,120 Z" fill="var(--cyan)"/>
          <path class="tail tail-right" d="M142,90 C180,95 200,150 186,220 C180,190 165,150 138,120 Z" fill="var(--cyan)"/>

          <!-- body -->
          <path d="M78,150 Q110,135 142,150 L150,230 Q110,246 70,230 Z" fill="var(--panel-soft)" stroke="var(--cyan)" stroke-width="2.5"/>
          <path d="M92,150 L96,190 L124,190 L128,150 Z" fill="var(--cyan)" opacity="0.5"/>

          <!-- arm wave -->
          <path class="arm-wave" d="M146,158 Q172,150 178,120" stroke="var(--panel-soft)" stroke-width="14" stroke-linecap="round" fill="none"/>
          <path d="M62,160 Q46,178 50,205" stroke="var(--panel-soft)" stroke-width="14" stroke-linecap="round" fill="none"/>

          <!-- head -->
          <circle cx="110" cy="110" r="52" fill="#F4E3D3"/>

          <!-- hair front -->
          <path d="M58,100 Q55,55 110,48 Q165,55 162,100 Q150,80 110,80 Q70,80 58,100 Z" fill="var(--cyan)"/>
          <path d="M60,96 Q56,72 78,58" stroke="var(--cyan)" stroke-width="10" stroke-linecap="round" fill="none"/>
          <path d="M160,96 Q164,72 142,58" stroke="var(--cyan)" stroke-width="10" stroke-linecap="round" fill="none"/>

          <!-- headset accessory -->
          <path d="M66,92 Q110,60 154,92" stroke="var(--pink)" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="66" cy="96" r="7" fill="var(--pink)"/>
          <circle cx="154" cy="96" r="7" fill="var(--pink)"/>

          <!-- blush -->
          <ellipse cx="82" cy="122" rx="9" ry="5" fill="var(--pink)" opacity="0.45"/>
          <ellipse cx="138" cy="122" rx="9" ry="5" fill="var(--pink)" opacity="0.45"/>

          <!-- eyes -->
          <g class="eyes">
            <ellipse class="eye" cx="90" cy="112" rx="7" ry="9" fill="#20202A"/>
            <ellipse class="eye" cx="130" cy="112" rx="7" ry="9" fill="#20202A"/>
            <circle cx="92.5" cy="108" r="2" fill="#fff"/>
            <circle cx="132.5" cy="108" r="2" fill="#fff"/>
          </g>

          <!-- smile -->
          <path d="M100,130 Q110,137 120,130" stroke="#20202A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="hero-text">
        <p class="eyebrow">GRADE NOTE</p>
        <h1 class="title">คำนวณเกรดเฉลี่ย</h1>
        <p class="subtitle">กรอกคะแนนกับหน่วยกิต แล้วให้มิโกะช่วยคำนวณให้เธอ</p>
      </div>
    </header>

    <!-- การ์ดคำนวณ -->
    <section class="card" aria-label="แบบฟอร์มคำนวณเกรด">

      <div class="table-wrap">
        <div class="row row-head">
          <span>วิชา</span>
          <span>คะแนน (0–100)</span>
          <span>หน่วยกิต</span>
          <span></span>
        </div>

        <div class="rows" id="rows"></div>
      </div>

      <button class="btn btn-add" id="addRow" type="button">+ เพิ่มวิชา</button>

      <div class="actions">
        <button class="btn btn-primary" id="calcBtn" type="button">คำนวณเกรด</button>
        <button class="btn btn-ghost" id="resetBtn" type="button">เริ่มใหม่</button>
      </div>

      <p class="error-msg" id="errorMsg" role="alert"></p>
    </section>

    <!-- ผลลัพธ์ -->
    <section class="result" id="resultSection" aria-live="polite">
      <div class="result-card">
        <div class="result-main">
          <p class="result-label">เกรดเฉลี่ย (GPA)</p>
          <div class="result-gpa" id="resultGpa">–</div>
          <div class="result-badge" id="resultBadge"></div>
        </div>
        <div class="result-side">
          <div class="stat">
            <span class="stat-label">หน่วยกิตรวม</span>
            <span class="stat-value" id="resultCredits">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">คะแนนเฉลี่ย</span>
            <span class="stat-value" id="resultAvgScore">0</span>
          </div>
        </div>
        <p class="result-note" id="resultNote"></p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Grade Note · mascot original design</p>
  </footer>

  <!-- แม่แบบแถวข้อมูล -->
  <template id="rowTemplate">
    <div class="row" data-row>
      <input type="text" class="input subject-input" placeholder="เช่น คณิตศาสตร์" data-field="subject">
      <input type="number" class="input score-input" placeholder="0-100" min="0" max="100" step="0.01" data-field="score">
      <input type="number" class="input credit-input" placeholder="1" min="0.5" max="10" step="0.5" value="1" data-field="credit">
      <button type="button" class="row-remove" data-remove aria-label="ลบวิชานี้">✕</button>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
