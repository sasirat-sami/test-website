<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar — Cute Pastel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sayle.css">
</head>
<body>

<div class="stage">

<nav class="navbar">

  <a href="#" class="brand">
    <span class="brand__blob">
      <svg viewBox="0 0 40 40" width="30" height="30">
        <path fill="#FFD6E7" d="M20 3c7 0 15 4 16 12 1 7-4 12-9 15-6 3-14 3-19-2S2 15 6 9 13 3 20 3Z"/>
        <circle cx="16" cy="18" r="2.2" fill="#5B4B66"/>
        <circle cx="25" cy="18" r="2.2" fill="#5B4B66"/>
        <path d="M15.5 24c1.8 2 6.2 2 8 0" stroke="#5B4B66" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <span class="brand__name">Momoko<span class="brand__dot">.</span></span>
  </a>

  <button class="navbar__toggle" id="navToggle" aria-label="เปิดเมนู" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <ul class="menu" id="navMenu">
    <li><a href="#" class="menu__link is-active"><span class="menu__emoji">🏡</span>หน้าแรก</a></li>
    <li><a href="#" class="menu__link"><span class="menu__emoji">🧁</span>สินค้า</a></li>
    <li><a href="#" class="menu__link"><span class="menu__emoji">✨</span>รีวิว</a></li>
    <li><a href="#" class="menu__link"><span class="menu__emoji">💌</span>เรื่องราว</a></li>
  </ul>

  <div class="contact">
    <a href="mailto:hello@momoko.co" class="bubble bubble--pink" aria-label="อีเมล" title="อีเมล">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13" rx="3"/>
        <path d="M3.8 6.8 12 12.5l8.2-5.7"/>
      </svg>
    </a>
    <a href="tel:+66000000000" class="bubble bubble--yellow" aria-label="โทรศัพท์" title="โทรศัพท์">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4.5c0-.6.4-1 1-1h3l2 5-2 1.3a10.4 10.4 0 0 0 5.2 5.2l1.3-2 5 2v3c0 .6-.4 1-1 1h-1.5C9.2 19 5 14.8 5 9.5V4.5Z"/>
      </svg>
    </a>
    <a href="https://line.me" target="_blank" rel="noopener" class="bubble bubble--mint" aria-label="แชท" title="แชท">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.5 7 0 0 1-8.7 7l-4.3 1.5 1-3.4A7 7 0 1 1 21 11.5Z"/>
      </svg>
    </a>
    <a href="#contact" class="cta">
      คุยกับเรา <span class="cta__heart">♡</span>
    </a>
  </div>

</nav>

<div class="scallop" aria-hidden="true"></div>

</div>

<script>
  const toggle = document.getElementById('navToggle');
  const menu = document.getElementById('navMenu');
  toggle.addEventListener('click', () => {
    const open = menu.classList.toggle('is-open');
    toggle.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', open);
  });
</script>

</body>
</html>
